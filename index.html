<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quickflix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      padding: 70px 25px;
      text-align: center;
      background: linear-gradient(135deg, #222, #111);
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .content {
      padding: 30px 20px;
    }

    .content h2 {
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: #222;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #ff4757;
      font-size: 20px;
      margin: 15px 0;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎬 Quickflix</div>

    <nav>
      <a href="/">Home</a>
      <a href="#content">Content</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to Quickflix</h1>
    <p>Your digital content platform</p>
    <a href="#content" class="btn">Explore Now</a>
  </section>

  <section class="content" id="content">
    <h2>Available Content</h2>

    <div class="cards">

      <div class="card">
        <h3>🎬 Premium Video</h3>
        <p>Movies collection</p>
        <div class="price">₹25</div>
        <a href="#" class="btn">View</a>
      </div>

      <div class="card">
        <h3>📺 Series Pack</h3>
        <p>Series collection</p>
        <div class="price">₹49</div>
        <a href="#" class="btn">View</a>
      </div>

      <div class="card">
        <h3>🧸 Cartoon Pack</h3>
        <p>Cartoon collection</p>
